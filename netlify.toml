[build]
  publish = "dist"
  command = "npm run build"

# Cache-Control headers to ensure browsers immediately fetch latest assets
[[headers]]
  for = "/indexbgg.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/filters/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fish food/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/FISH MEDICINE/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tanks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA rewrite: serve index.html for all client-side routes (e.g. /products/:slug)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
